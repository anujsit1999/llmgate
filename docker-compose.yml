# Two gateway replicas sharing rate limits and capacity through Redis.
#   docker compose up --build --scale llmgate=2
services:
  llmgate:
    build: .
    ports:
      - "8080-8081:8080"
    volumes:
      - ./config.yaml:/etc/llmgate/config.yaml:ro
    environment:
      - LLMGATE_STATE_BACKEND=redis
      - LLMGATE_REDIS_ADDR=redis:6379
      - LLMGATE_ADMIN_ADDR=0.0.0.0:9090   # inside the container network only
      # Provider credentials from your shell / a git-ignored .env file:
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - AZURE_OPENAI_API_KEY
      - AWS_BEARER_TOKEN_BEDROCK
      - GEMINI_API_KEY
    depends_on: [redis]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # counters only: no persistence needed
    read_only: true
    tmpfs: [/data]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
